name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
# Unit tests mock Puppeteer; the required browser gate uses Playwright instead.
# npm ci still runs the CLI workspace's existing prepare/build hook.
env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit and integration tests
        run: npm test -- --max-workers=50%
      - name: Embed unit tests
        run: npm test --workspace @bitmapforge/embed
      # prebuild builds the SDK and copies it to public/embed before Vite builds.
      - name: Build app and embed package
        run: npm run build
      - name: Assert embed bundle size ≤ 50 KB
        run: |
          SIZE=$(gzip -c packages/embed/dist/bitmap-forge.es.js | wc -c)
          echo "Embed bundle gzipped size: ${SIZE} bytes"
          if [ "$SIZE" -gt 51200 ]; then
            echo "ERROR: embed bundle exceeds 50 KB limit (${SIZE} bytes > 51200)"
            exit 1
          fi
          echo "OK: ${SIZE} bytes ≤ 51200"
      - name: Verify no alias leakage in embed dist
        run: |
          if grep -r "@engine" packages/embed/dist/; then
            echo "ERROR: @engine alias leaked into dist"
            exit 1
          fi
      - name: Verify packaged SDK identity and record build provenance
        env:
          REVISION: ${{ github.sha }}
        run: |
          cmp packages/embed/dist/bitmap-forge.es.js public/embed/bitmap-forge.es.js
          cmp packages/embed/dist/bitmap-forge.es.js dist/embed/bitmap-forge.es.js
          printf '%s\n' "$REVISION" > dist/ci-revision.txt
          (cd dist && find . -type f ! -name ci-sha256sums.txt -print0 | sort -z | xargs -0 sha256sum > ci-sha256sums.txt)
      - name: Upload tested build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked workspace deps
        run: npm ci
      - name: Build CLI headless bundle explicitly
        run: npm run build --workspace @bitmapforge/cli
      - name: Run CLI unit tests
        run: npm test --workspace @bitmapforge/cli
  export-decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Export decode and archive tests
        run: npm run test:export
      - name: Upload decode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-decode-evidence
          path: test/fixtures/outputs/
          if-no-files-found: warn
  browser:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Verify downloaded build identity
        env:
          REVISION: ${{ github.sha }}
        run: |
          test "$(cat dist/ci-revision.txt)" = "$REVISION"
          (cd dist && sha256sum --check ci-sha256sums.txt)
      # Gate the existing suite, not incomplete new UI specs authored in parallel.
      - name: Existing export and generated-archive browser suite against built app
        run: npx --no-install playwright test --config .github/ci/playwright.config.js
      - name: Upload browser evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test/fixtures/outputs/
          if-no-files-found: warn
  deploy:
    needs: [check, cli, export-decode, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Do not cancel an accepted remote deployment. Reject stale queued runs below.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install pinned deployment CLI
        run: npm install --global vercel@65.15.0
      - name: Reject superseded main revision immediately before deployment
        env:
          REVISION: ${{ github.sha }}
        run: |
          CURRENT_MAIN=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$CURRENT_MAIN" != "$REVISION" ]; then
            echo "Refusing stale release $REVISION; main is $CURRENT_MAIN"
            exit 1
          fi
      # This is a Vercel source rebuild, NOT deployment of the tested dist artifact.
      # See docs/ci-release-safety.md: approval/settings/provenance remain release gates.
      - name: Deploy approved revision to Vercel (rebuild)
        run: vercel deploy --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
